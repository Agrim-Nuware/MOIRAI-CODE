# load a pretrained checkpoint from huggingface hub
_target_: uni2ts.model.moirai_moe.MoiraiMoEFinetune
module:
  _target_: uni2ts.model.moirai_moe.MoiraiMoEModule.from_pretrained
  pretrained_model_name_or_path: Salesforce/moirai-moe-1.0-R-base
min_patches: 2
min_mask_ratio: 0.15
max_mask_ratio: 0.5
max_dim: 128
loss_func:
  _target_: uni2ts.loss.packed.PackedNLLLoss
val_metric:
  - _target_: uni2ts.loss.packed.PackedMSELoss
  - _target_: uni2ts.loss.packed.PackedNRMSELoss
    normalize: absolute_target_squared
lr: 1e-5
weight_decay: 1e-1
beta1: 0.9
beta2: 0.98
num_training_steps: null
num_warmup_steps: 0
patch_size: null
context_length: null
prediction_length: null
finetune_pattern: full
use_8bit_adam: false
